plugins {
    id 'com.android.application'
}

// 发布签名：读取 android/keystore.properties（不入库，见 README）。缺失时回退到 debug 签名，保证本地也能出可安装包。
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.hyarto.wings'
    compileSdk 34

    defaultConfig {
        applicationId "com.hyarto.wings"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "0.1.1"
        // 仅 arm64-v8a（libapp_client.so + libc++_shared.so 由 cargo-ndk 放入 src/main/jniLibs）
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            // .so 已 strip；让 APK 内压缩存放，体积更小（minSdk>=23 可选择不解压运行）
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // !! 必须与 Rust 侧 android-activity 内置（静态链入 libapp_client.so）的 GameActivity C 层同一版本，
    // 否则 onTouchEventNative 的 JNI 签名对不上 → RegisterNatives 失败 → abort()（SIGABRT 闪退）。
    // android-activity 0.6.x <=> games-activity 4.4.0（向下兼容 4.0.0）。升级 android-activity 时同步修改；
    // android/verify_abi.sh 会在打包后校验两端签名一致。
    implementation 'androidx.games:games-activity:4.4.0'
}
