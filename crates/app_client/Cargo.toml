[package]
name = "app_client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "app_client"
path = "src/main.rs"

[features]
# 开发期动态链接加速编译：cargo run -p app_client --features dev
dev = ["bevy/dynamic_linking"]

[dependencies]
sim_core = { path = "../sim_core" }
world_gen = { path = "../world_gen" }
# 音效在内存中合成为 WAV，bevy 默认只带 vorbis 解码器，必须显式启用 wav，否则 Windows 下
# 音频解码线程会 panic: UnrecognizedFormat
bevy = { version = "0.18", features = ["wav"] }
glam = { workspace = true }

# Android：GameActivity 后端（仅在目标为 android 时启用；见 android/ 与 docs/ANDROID_PORT.md）
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.18", features = ["wav", "android-game-activity"] }
